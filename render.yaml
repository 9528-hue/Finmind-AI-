services:
  - type: web
    name: finmind-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./finmind.db
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: "https://finmind-ai.vercel.app,http://localhost:3000"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DEFAULT_CURRENCY
        value: INR
      - key: DEMO_MODE
        value: "false"
